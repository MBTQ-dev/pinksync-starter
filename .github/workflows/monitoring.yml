# .github/workflows/monitoring.yml

# Continuous Monitoring & Alerting

name: 📊 Monitoring & Metrics

on:
schedule:
- cron: ‘*/15 * * * *’  # Every 15 minutes
workflow_dispatch:

jobs:
health-checks:
name: 🏥 Service Health Checks
runs-on: ubuntu-latest
strategy:
matrix:
service:
- name: deafauth
url: https://deafauth.pinksync.io
critical: true
- name: vcode
url: https://vcode.pinksync.io
critical: true
- name: pinkflow
url: https://pinkflow.pinksync.io
critical: true
- name: event-orchestrator
url: https://events.pinksync.io
critical: false
- name: rag-engine
url: https://rag.pinksync.io
critical: false
steps:
- name: Check ${{ matrix.service.name }}
id: health_check
continue-on-error: true
run: |
response=$(curl -s -o /dev/null -w “%{http_code}” ${{ matrix.service.url }}/health)
if [ $response -eq 200 ]; then
echo “status=healthy” >> $GITHUB_OUTPUT
else
echo “status=unhealthy” >> $GITHUB_OUTPUT
exit 1
fi

```
  - name: Alert on Critical Failure
    if: failure() && matrix.service.critical == true
    uses: slackapi/slack-github-action@v1
    with:
      payload: |
        {
          "text": "🚨 CRITICAL: ${{ matrix.service.name }} is DOWN!",
          "blocks": [
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "*CRITICAL SERVICE DOWN* 🚨\n*Service:* ${{ matrix.service.name }}\n*URL:* ${{ matrix.service.url }}\n*Impact:* Deaf users cannot access service\n*Action Required:* Immediate investigation"
              }
            }
          ]
        }
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_CRITICAL }}
```

performance-metrics:
name: ⚡ Performance Metrics
runs-on: ubuntu-latest
steps:
- name: Test Response Times
id: perf_test
run: |
# Test DeafAUTH login speed (critical for UX)
deafauth_time=$(curl -w “%{time_total}” -s -o /dev/null https://deafauth.pinksync.io/api/login)
echo “deafauth_ms=$deafauth_time” >> $GITHUB_OUTPUT

```
      # Test caption processing speed (critical for accessibility)
      caption_time=$(curl -w "%{time_total}" -s -o /dev/null https://vcode.pinksync.io/api/caption/test)
      echo "caption_ms=$caption_time" >> $GITHUB_OUTPUT
      
      # Test PinkFlow transformation speed
      pinkflow_time=$(curl -w "%{time_total}" -s -o /dev/null https://pinkflow.pinksync.io/api/transform)
      echo "pinkflow_ms=$pinkflow_time" >> $GITHUB_OUTPUT
  
  - name: Alert on Slow Performance
    if: steps.perf_test.outputs.deafauth_ms > 1.0 || steps.perf_test.outputs.caption_ms > 2.0
    uses: slackapi/slack-github-action@v1
    with:
      payload: |
        {
          "text": "⚠️ Performance Degradation Detected",
          "blocks": [
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "*Performance Alert* ⚠️\n*DeafAUTH:* ${{ steps.perf_test.outputs.deafauth_ms }}s\n*Captions:* ${{ steps.perf_test.outputs.caption_ms }}s\n*PinkFlow:* ${{ steps.perf_test.outputs.pinkflow_ms }}s\n*Threshold:* 1s for auth, 2s for captions"
              }
            }
          ]
        }
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_PERF }}
```

accessibility-monitoring:
name: ♿ Accessibility Compliance
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

```
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20.x
  
  - name: Install axe-core
    run: npm install -g @axe-core/cli
  
  - name: Test Live Sites
    run: |
      axe https://pinksync.io --exit --tags wcag2aaa > accessibility-report.json
      axe https://vcode.pinksync.io --exit --tags wcag2aaa >> accessibility-report.json
  
  - name: Upload Report
    uses: actions/upload-artifact@v4
    with:
      name: accessibility-report
      path: accessibility-report.json
  
  - name: Alert on Violations
    if: failure()
    run: |
      echo "⚠️ Accessibility violations detected - this affects Deaf users!"
```

