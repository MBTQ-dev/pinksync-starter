# .github/workflows/dependency-updates.yml

# Automated Dependency Management

name: 📦 Dependency Updates

on:
schedule:
- cron: ‘0 0 * * 1’  # Every Monday at midnight
workflow_dispatch:

jobs:
update-deno-deps:
name: 🦕 Update Deno Dependencies
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

```
  - name: Setup Deno
    uses: denoland/setup-deno@v1
    with:
      deno-version: vx.x.x  # Latest
  
  - name: Update Dependencies
    run: |
      # Update all Deno services
      for service in services/*/; do
        if [ -f "$service/deno.json" ]; then
          echo "Updating $service"
          cd "$service"
          deno cache --reload --lock=deno.lock **/*.ts
          cd ../..
        fi
      done
  
  - name: Run Tests
    run: |
      deno test --allow-all
  
  - name: Create Pull Request
    uses: peter-evans/create-pull-request@v5
    with:
      commit-message: 'chore: update Deno dependencies'
      title: '📦 Automated Deno Dependency Update'
      body: |
        Automated dependency update for Deno services.
        
        - Updated all imports to latest versions
        - Ran tests to ensure compatibility
        
        Please review and merge if tests pass.
      branch: deps/deno-update
      labels: dependencies, automated
```

security-audit:
name: 🔒 Security Audit
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

```
  - name: Run npm audit
    run: |
      for service in services/*/; do
        if [ -f "$service/package.json" ]; then
          echo "Auditing $service"
          cd "$service"
          npm audit --audit-level=moderate || true
          cd ../..
        fi
      done
  
  - name: Run Deno security check
    run: deno check --unstable **/*.ts
```