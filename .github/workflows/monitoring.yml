# .github/workflows/feature-flags.yml

# Feature Flag Management & A/B Testing

name: 🎚️ Feature Flags

on:
workflow_dispatch:
inputs:
flag_name:
description: ‘Feature flag to toggle’
required: true
type: choice
options:
- ASL_RECOGNITION_V2
- GROQ_TRANSCRIPTION
- REAL_TIME_CAPTIONS
- MEDIAPIPE_ASL
- LIVEKIT_VIDEO
action:
description: ‘Action to perform’
required: true
type: choice
options:
- enable_10_percent
- enable_50_percent
- enable_all
- disable_all
environment:
description: ‘Environment’
required: true
type: choice
options:
- staging
- production

jobs:
toggle-feature:
name: 🎛️ Toggle Feature Flag
runs-on: ubuntu-latest
environment: ${{ github.event.inputs.environment }}
steps:
- uses: actions/checkout@v4

```
  - name: Update Feature Flag Configuration
    run: |
      # Update environment variables
      FEATURE_FLAG="${{ github.event.inputs.flag_name }}"
      ACTION="${{ github.event.inputs.action }}"
      ENV="${{ github.event.inputs.environment }}"
      
      echo "Toggling $FEATURE_FLAG to $ACTION in $ENV"
      
      # Update flag configuration
      case $ACTION in
        enable_10_percent)
          PERCENTAGE=10
          ;;
        enable_50_percent)
          PERCENTAGE=50
          ;;
        enable_all)
          PERCENTAGE=100
          ;;
        disable_all)
          PERCENTAGE=0
          ;;
      esac
      
      echo "Setting $FEATURE_FLAG to $PERCENTAGE% rollout"
  
  - name: Deploy Flag Configuration
    env:
      DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
    run: |
      # Deploy updated configuration to services
      echo "Deploying feature flag configuration..."
      
      # Update config in Deno Deploy or your config service
      curl -X POST https://api.pinksync.io/config/feature-flags \
        -H "Authorization: Bearer ${{ secrets.API_TOKEN }}" \
        -H "Content-Type: application/json" \
        -d '{
          "flag": "${{ github.event.inputs.flag_name }}",
          "percentage": '$PERCENTAGE',
          "environment": "${{ github.event.inputs.environment }}"
        }'
  
  - name: Notify Team
    uses: slackapi/slack-github-action@v1
    with:
      payload: |
        {
          "text": "🎚️ Feature Flag Updated",
          "blocks": [
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "*Feature Flag Changed*\n*Flag:* ${{ github.event.inputs.flag_name }}\n*Action:* ${{ github.event.inputs.action }}\n*Environment:* ${{ github.event.inputs.environment }}\n*By:* ${{ github.actor }}"
              }
            }
          ]
        }
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  
  - name: Create Monitoring Dashboard
    run: |
      # Create a temporary monitoring dashboard to track feature flag impact
      echo "Creating dashboard for ${{ github.event.inputs.flag_name }}..."
      
      # This would integrate with Grafana API
      curl -X POST https://grafana.pinksync.io/api/dashboards/db \
        -H "Authorization: Bearer ${{ secrets.GRAFANA_API_KEY }}" \
        -H "Content-Type: application/json" \
        -d '{
          "dashboard": {
            "title": "Feature: ${{ github.event.inputs.flag_name }}",
            "tags": ["feature-flag", "monitoring"],
            "timezone": "browser",
            "panels": [
              {
                "title": "User Adoption Rate",
                "type": "graph"
              },
              {
                "title": "Error Rate Comparison",
                "type": "graph"
              }
            ]
          }
        }'
```

