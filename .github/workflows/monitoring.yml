# .github/workflows/user-feedback.yml

# Automated User Feedback Pipeline

name: 📢 User Feedback Pipeline

on:
repository_dispatch:
types: [user_feedback]
workflow_dispatch:

jobs:
process-feedback:
name: 📝 Process User Feedback
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

```
  - name: Parse Feedback
    id: parse
    run: |
      # Extract feedback from webhook payload
      FEEDBACK_TYPE="${{ github.event.client_payload.type }}"
      FEEDBACK_TEXT="${{ github.event.client_payload.text }}"
      USER_ID="${{ github.event.client_payload.user_id }}"
      
      echo "type=$FEEDBACK_TYPE" >> $GITHUB_OUTPUT
      echo "text=$FEEDBACK_TEXT" >> $GITHUB_OUTPUT
      echo "user=$USER_ID" >> $GITHUB_OUTPUT
  
  - name: Create Issue for Critical Feedback
    if: steps.parse.outputs.type == 'caption_error' || steps.parse.outputs.type == 'accessibility_issue'
    uses: actions/github-script@v7
    with:
      script: |
        const issue = await github.rest.issues.create({
          owner: context.repo.owner,
          repo: context.repo.repo,
          title: `User Report: ${{ steps.parse.outputs.type }}`,
          labels: ['user-reported', 'accessibility', '${{ steps.parse.outputs.type }}'],
          body: `
          ## User Feedback Report
          
          **Type**: ${{ steps.parse.outputs.type }}
          **Reported By**: User ${{ steps.parse.outputs.user }}
          **Timestamp**: ${new Date().toISOString()}
          
          ### Description
          ${{ steps.parse.outputs.text }}
          
          ### Priority
          - [ ] Fix ASAP (accessibility blocker)
          - [ ] Fix this week
          - [ ] Backlog
          
          ### Affected Services
          - [ ] DeafAUTH
          - [ ] VCode
          - [ ] PinkFlow
          - [ ] Browser Extension
          
          ---
          *Auto-generated from user feedback webhook*
          `
        });
        
        console.log(`Created issue #${issue.data.number}`);
  
  - name: Notify Development Team
    if: steps.parse.outputs.type == 'caption_error'
    uses: slackapi/slack-github-action@v1
    with:
      payload: |
        {
          "text": "🚨 User Reported Caption Error",
          "blocks": [
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "*Caption Error Reported* 🚨\n*User:* ${{ steps.parse.outputs.user }}\n*Issue:* ${{ steps.parse.outputs.text }}\n*Action:* Review and fix immediately - this affects accessibility"
              }
            }
          ]
        }
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URGENT }}
```

