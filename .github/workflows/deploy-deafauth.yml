# .github/workflows/deploy-extension.yml

# Browser Extension Build & Publish

name: 🧩 Extension Deploy

on:
push:
branches: [main, feat-Pinksync-AI]
paths:
- ‘extension/**’
- ‘.github/workflows/deploy-extension.yml’
workflow_dispatch:
inputs:
publish_store:
description: ‘Publish to Chrome Web Store’
required: true
type: boolean
default: false

jobs:
build:
name: 🔨 Build Extension
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

```
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20.x
  
  - name: Install Dependencies
    run: |
      cd extension
      npm ci
  
  - name: Build Extension
    run: |
      cd extension
      npm run build
  
  - name: Package Extension
    run: |
      cd extension/dist
      zip -r ../pinksync-extension-${{ github.sha }}.zip .
  
  - name: Upload Artifact
    uses: actions/upload-artifact@v4
    with:
      name: extension-build
      path: extension/pinksync-extension-${{ github.sha }}.zip
```

test:
name: 🧪 E2E Tests
runs-on: ubuntu-latest
needs: build
steps:
- uses: actions/checkout@v4

```
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20.x
  
  - name: Install Playwright
    run: |
      cd extension
      npm ci
      npx playwright install chromium
  
  - name: Run E2E Tests
    run: |
      cd extension
      npm run test:e2e
  
  - name: Upload Test Results
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: playwright-results
      path: extension/test-results/
```

publish:
name: 📦 Publish to Chrome Web Store
runs-on: ubuntu-latest
needs: [build, test]
if: github.ref == ‘refs/heads/main’ && github.event.inputs.publish_store == ‘true’
steps:
- uses: actions/checkout@v4

```
  - name: Download Build Artifact
    uses: actions/download-artifact@v4
    with:
      name: extension-build
  
  - name: Publish to Chrome Web Store
    uses: mnao305/chrome-extension-upload@v4
    with:
      file-path: pinksync-extension-${{ github.sha }}.zip
      extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
      client-id: ${{ secrets.CHROME_CLIENT_ID }}
      client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
      refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
  
  - name: Create GitHub Release
    uses: softprops/action-gh-release@v1
    with:
      tag_name: v${{ github.run_number }}
      name: Extension v${{ github.run_number }}
      files: pinksync-extension-${{ github.sha }}.zip
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```