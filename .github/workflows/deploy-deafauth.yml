# .github/workflows/deploy-vcode.yml

# VCode Service - Video Communication & AI Transcription

name: 🎥 VCode Deploy

on:
push:
branches: [vcode, main]
paths:
- ‘services/vcode/**’
- ’services/ai-service/**’
- ‘.github/workflows/deploy-vcode.yml’
pull_request:
paths:
- ‘services/vcode/**’

env:
DENO_VERSION: 1.45.0
NODE_VERSION: 20.x

jobs:
validate:
name: 🔍 Validate
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

```
  - name: Setup Node.js (for AI service)
    uses: actions/setup-node@v4
    with:
      node-version: ${{ env.NODE_VERSION }}
      cache: 'npm'
      cache-dependency-path: services/ai-service/package-lock.json
  
  - name: Install Dependencies
    run: |
      cd services/ai-service
      npm ci
  
  - name: Lint & Type Check
    run: |
      cd services/ai-service
      npm run lint
      npm run type-check
```

test:
name: 🧪 Test VCode & AI Services
runs-on: ubuntu-latest
needs: validate
services:
postgres:
image: postgres:15
env:
POSTGRES_PASSWORD: postgres
POSTGRES_DB: vcode_test
options: >-
–health-cmd pg_isready
–health-interval 10s
–health-timeout 5s
–health-retries 5
ports:
- 5432:5432

```
  redis:
    image: redis:7-alpine
    options: >-
      --health-cmd "redis-cli ping"
      --health-interval 10s
      --health-timeout 5s
      --health-retries 5
    ports:
      - 6379:6379

steps:
  - uses: actions/checkout@v4
  
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: ${{ env.NODE_VERSION }}
  
  - name: Install Dependencies
    run: |
      cd services/ai-service
      npm ci
  
  - name: Run Integration Tests
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vcode_test
      REDIS_URL: redis://localhost:6379
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    run: |
      cd services/ai-service
      npm test -- --coverage
  
  - name: Test Groq AI Connection
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    run: |
      cd services/ai-service
      node test-groq-connection.js
```

deploy-staging:
name: 🚧 Deploy to Staging
runs-on: ubuntu-latest
needs: [validate, test]
if: github.event_name == ‘pull_request’
environment:
name: staging
url: https://vcode-staging.pinksync.io
steps:
- uses: actions/checkout@v4

```
  - name: Deploy to Staging
    run: |
      echo "Deploying to staging environment..."
      # Add your staging deployment commands here
  
  - name: Comment PR with Staging URL
    uses: actions/github-script@v7
    with:
      script: |
        github.rest.issues.createComment({
          issue_number: context.issue.number,
          owner: context.repo.owner,
          repo: context.repo.repo,
          body: '🚧 **Staging Deployment Ready**\n\nTest at: https://vcode-staging.pinksync.io\n\nCommit: ${{ github.sha }}'
        })
```

deploy-production:
name: 🚀 Deploy to Production
runs-on: ubuntu-latest
needs: [validate, test]
if: github.ref == ‘refs/heads/vcode’ || github.ref == ‘refs/heads/main’
environment:
name: production
url: https://vcode.pinksync.io
steps:
- uses: actions/checkout@v4

```
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: ${{ env.NODE_VERSION }}
  
  - name: Build Production Assets
    run: |
      cd services/ai-service
      npm ci --production
      npm run build
  
  - name: Deploy to Production
    env:
      DEPLOY_KEY: ${{ secrets.VCODE_DEPLOY_KEY }}
    run: |
      # Deploy to your production environment
      # Could be Vercel, Deno Deploy, or custom server
      echo "Deploying VCode to production..."
  
  - name: Run Post-Deployment Health Checks
    run: |
      sleep 15
      curl -f https://vcode.pinksync.io/health || exit 1
      curl -f https://vcode.pinksync.io/api/ai/health || exit 1
  
  - name: Create Deployment Tag
    run: |
      git tag "vcode-$(date +%Y%m%d-%H%M%S)"
      git push origin --tags
```

