# .github/workflows/deploy-deafauth.yml

# DeafAUTH Service - Identity & Authentication Gateway

name: 🔐 DeafAUTH Deploy

on:
push:
branches: [main, feat-Pinksync-AI]
paths:
- ‘services/deafauth/**’
- ’deno-deafauth/**’
- ‘.github/workflows/deploy-deafauth.yml’
pull_request:
paths:
- ‘services/deafauth/**’
- ’deno-deafauth/**’

env:
DENO_VERSION: 1.45.0
SERVICE_NAME: deafauth

jobs:

# Stage 1: Lint & Type Check

validate:
name: 🔍 Validate Code
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

```
  - name: Setup Deno
    uses: denoland/setup-deno@v1
    with:
      deno-version: ${{ env.DENO_VERSION }}
  
  - name: Cache Deno dependencies
    uses: actions/cache@v3
    with:
      path: ~/.cache/deno
      key: deno-${{ hashFiles('deno.json', 'deno.lock') }}
  
  - name: Lint Code
    run: |
      cd services/deafauth
      deno lint
  
  - name: Format Check
    run: |
      cd services/deafauth
      deno fmt --check
  
  - name: Type Check
    run: |
      cd services/deafauth
      deno check **/*.ts
```

# Stage 2: Security Scan

security:
name: 🛡️ Security Scan
runs-on: ubuntu-latest
needs: validate
steps:
- uses: actions/checkout@v4

```
  - name: Run Trivy vulnerability scanner
    uses: aquasecurity/trivy-action@master
    with:
      scan-type: 'fs'
      scan-ref: 'services/deafauth'
      severity: 'CRITICAL,HIGH'
      exit-code: '1'
  
  - name: Check for secrets
    uses: trufflesecurity/trufflehog@main
    with:
      path: services/deafauth
      base: main
      head: HEAD
```

# Stage 3: Test Suite

test:
name: 🧪 Test Suite
runs-on: ubuntu-latest
needs: validate
steps:
- uses: actions/checkout@v4

```
  - name: Setup Deno
    uses: denoland/setup-deno@v1
    with:
      deno-version: ${{ env.DENO_VERSION }}
  
  - name: Run Unit Tests
    run: |
      cd services/deafauth
      deno test --allow-all --coverage=coverage
  
  - name: Generate Coverage Report
    run: |
      cd services/deafauth
      deno coverage coverage --lcov > coverage.lcov
  
  - name: Upload Coverage to Codecov
    uses: codecov/codecov-action@v3
    with:
      files: services/deafauth/coverage.lcov
      flags: deafauth
      name: deafauth-coverage
```

# Stage 4: Build & Deploy

deploy:
name: 🚀 Deploy to Production
runs-on: ubuntu-latest
needs: [validate, security, test]
if: github.ref == ‘refs/heads/main’ || github.ref == ‘refs/heads/feat-Pinksync-AI’
environment:
name: production
url: https://deafauth.pinksync.io
steps:
- uses: actions/checkout@v4

```
  - name: Setup Deno
    uses: denoland/setup-deno@v1
    with:
      deno-version: ${{ env.DENO_VERSION }}
  
  - name: Deploy to Deno Deploy
    uses: denoland/deployctl@v1
    with:
      project: pinksync-deafauth
      entrypoint: services/deafauth/server.ts
      root: services/deafauth
    env:
      DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
  
  - name: Health Check
    run: |
      sleep 10
      curl -f https://deafauth.pinksync.io/health || exit 1
  
  - name: Notify Deployment Success
    if: success()
    uses: slackapi/slack-github-action@v1
    with:
      payload: |
        {
          "text": "🔐 DeafAUTH deployed successfully!",
          "blocks": [
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "*DeafAUTH Service Deployed* ✅\n*Commit:* ${{ github.sha }}\n*By:* ${{ github.actor }}\n*URL:* https://deafauth.pinksync.io"
              }
            }
          ]
        }
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
```

